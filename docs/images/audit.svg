  <text x="28" y="286" xml:space="preserve"><tspan fill="#7d8f91">  13:23  </tspan><tspan fill="#e9c46a">warning  </tspan><tspan fill="#5fd0c5">SL-03  </tspan><tspan fill="#e6eded">Emoji used in the interface. Use an icon from the project set.</tspan></text>
  <text x="28" y="308" xml:space="preserve"><tspan fill="#7d8f91">  20:5   </tspan><tspan fill="#e9c46a">warning  </tspan><tspan fill="#5fd0c5">NC-08  </tspan><tspan fill="#e6eded">title="…" shows the slow, unstyled browser tooltip.</tspan></text>
  <text x="28" y="330" xml:space="preserve"><tspan fill="#7d8f91">  24:31  </tspan><tspan fill="#e9c46a">warning  </tspan><tspan fill="#5fd0c5">SL-07  </tspan><tspan fill="#e6eded">Generic marketing phrase "Supercharge your".</tspan></text>
  <text x="28" y="352" xml:space="preserve"><tspan fill="#7d8f91">  25:73  </tspan><tspan fill="#f08a75">error    </tspan><tspan fill="#5fd0c5">CP-01  </tspan><tspan fill="#e6eded">Lorem ipsum in source.</tspan></text>
  <text x="28" y="374" xml:space="preserve"><tspan fill="#7d8f91">  26:34  </tspan><tspan fill="#f08a75">error    </tspan><tspan fill="#5fd0c5">NC-07  </tspan><tspan fill="#e6eded">alert() opens a browser dialog that cannot be styled.</tspan></text>
